[workspace]
name = "beet"
version = "0.2.0"
description = "Typed, composable behavior trees for C++20"
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/EzraBrooks/beet"
repository = "https://github.com/EzraBrooks/beet"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[workspace.dependencies]
cpp-expected = ">=1.1"

# Builds the conda package: `pixi publish --target-dir dist`.
[package]
name = { workspace = true }
version = { workspace = true }
description = { workspace = true }
license = { workspace = true }
license-file = "LICENSE"
readme = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[package.build.backend]
name = "pixi-build-cmake"
version = "0.*"

[package.build.config]
# Mirrors the `package` CMake preset, so the package doesn't bundle a fetched tl::expected.
extra-args = ["-DCMAKE_REQUIRE_FIND_PACKAGE_tl-expected=ON", "-DBUILD_TESTING=OFF", "-DBEET_BUILD_EXAMPLES=OFF"]

[package.host-dependencies]
cpp-expected = { workspace = true }

[package.run-dependencies]
cpp-expected = { workspace = true }

# Installs the package's build, host and run dependencies without building it.
[dev]
beet = { path = "." }

[dependencies]
doctest = ">=2.4"

[tasks]
configure = "cmake --preset dev"
build = { cmd = "cmake --build --preset dev", depends-on = ["configure"] }
test = { cmd = "ctest --preset dev", depends-on = ["build"] }
example = { cmd = "./build/examples/robot_patrol", depends-on = ["build"] }
bench-configure = "cmake --preset bench"
bench-build = { cmd = "cmake --build --preset bench", depends-on = ["bench-configure"] }
bench = { cmd = "./build-bench/benchmarks/tick_rate 5e6", depends-on = ["bench-build"] }
clean = "rm -rf build build-rerun build-bench build-roboplan build-package"

# Install beet to a local prefix, then build and run tests/package against it. This is the only
# thing that proves find_package(beet) still works for downstream projects.
package-configure = "cmake --preset package"
package-install = { cmd = "cmake --install build-package", depends-on = ["package-configure"] }
package-consumer = { cmd = "cmake -S tests/package -B build-package/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$PWD/build-package/prefix && cmake --build build-package/consumer", depends-on = [
  "package-install",
] }
package-test = { cmd = "./build-package/consumer/beet_package_test", depends-on = ["package-consumer"] }

[feature.rerun.dependencies]
librerun-sdk = ">=0.38"
rerun-sdk = ">=0.38"

[feature.rerun.tasks]
rerun-configure = "cmake --preset rerun"
rerun-build = { cmd = "cmake --build --preset rerun", depends-on = ["rerun-configure"] }
rerun-example = { cmd = "./build-rerun/examples/rerun_status", depends-on = ["rerun-build"] }
rerun-record = { cmd = "./build-rerun/examples/rerun_status --save build-rerun/mission.rrd", depends-on = ["rerun-build"] }

[feature.roboplan.dependencies]
libroboplan-rrt = ">=0.7"
libroboplan-toppra = ">=0.7"
libroboplan-example-models = ">=0.7"

[feature.roboplan.tasks]
roboplan-configure = "cmake --preset roboplan"
roboplan-build = { cmd = "cmake --build --preset roboplan", depends-on = ["roboplan-configure"] }
roboplan-example = { cmd = "./build-roboplan/examples/roboplan_ur5", depends-on = ["roboplan-build"] }
roboplan-record = { cmd = "./build-roboplan/examples/roboplan_ur5 --save build-roboplan/ur5.rrd", depends-on = ["roboplan-build"] }

[feature.lint.dependencies]
# clang-tidy needs the builtin headers shipped with the matching clang release.
clang-tools = "21.*"
clang = "21.*"
python = "*"

[feature.lint.tasks]
format = "clang-format -i include/beet/*.hpp tests/*.cpp tests/compile_fail/*.cpp tests/package/*.cpp examples/*.cpp examples/*.hpp benchmarks/*.cpp"
format-check = "clang-format --dry-run --Werror include/beet/*.hpp tests/*.cpp tests/compile_fail/*.cpp tests/package/*.cpp examples/*.cpp examples/*.hpp benchmarks/*.cpp"
# compile_fail sources are excluded because they are meant not to compile. The conda include directory is
# implicit for GCC, so it is missing from compile_commands.json.
lint = { cmd = "run-clang-tidy -p build -quiet -extra-arg=-isystem$CONDA_PREFIX/include '^(?!.*/compile_fail/).*\\.cpp$'", depends-on = ["configure"] }

[environments]
rerun = ["rerun"]
roboplan = ["rerun", "roboplan"]
lint = ["lint"]
