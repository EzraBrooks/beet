[workspace]
name = "beet"
version = "0.2.0"
description = "Typed, composable behavior trees for C++20"
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/EzraBrooks/beet"
repository = "https://github.com/EzraBrooks/beet"
channels = ["conda-forge"]
# libc++ ships std::format's floating-point support from macOS 13.3 onward.
platforms = [
  { name = "osx-arm64-macos-13-3", platform = "osx-arm64", macos = "13.3" },
  { name = "osx-64-macos-13-3", platform = "osx-64", macos = "13.3" },
  "linux-64",
  "linux-aarch64",
]
preview = ["pixi-build"]

[workspace.dependencies]
cpp-expected = ">=1.1"

# Installs the packages' build, host and run dependencies without building them.
[dev]
beet = { path = "beet" }
beet-rerun = { path = "beet-rerun" }
beet-examples = { path = "examples" }

[dependencies]
doctest = ">=2.4"

[tasks]
configure = "cmake --preset dev"
build = { cmd = "cmake --build --preset dev", depends-on = ["configure"] }
test = { cmd = "ctest --preset dev", depends-on = ["build"] }
example = { cmd = "./build/examples/robot_patrol", depends-on = ["build"] }
bench-build = { cmd = "cmake --build --preset examples --target tick_rate", depends-on = ["examples-configure"] }
bench = { cmd = "./build-examples/examples/tick_rate 5e6", depends-on = ["bench-build"] }
clean = "cmake --build --preset dev --target clean"

# Install beet to a local prefix, then build and run tests/package against it. This is the only
# thing that proves find_package(beet) still works for downstream projects.
package-configure = "cmake --preset package"
package-install = { cmd = "cmake --install build-package", depends-on = ["package-configure"] }
package-consumer = { cmd = "cmake -S beet/tests/package -B build-package/consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$PWD/build-package/prefix && cmake --build build-package/consumer", depends-on = [
  "package-install",
] }
package-test = { cmd = "./build-package/consumer/beet_package_test", depends-on = ["package-consumer"] }

examples-configure = "cmake --preset examples"
examples-build = { cmd = "cmake --build --preset examples", depends-on = ["examples-configure"] }
rerun-example = { cmd = "./build-examples/examples/rerun_status", depends-on = ["examples-build"] }
rerun-record = { cmd = "./build-examples/examples/rerun_status --save build-examples/mission.rrd", depends-on = ["examples-build"] }
roboplan-example = { cmd = "./build-examples/examples/roboplan_ur5", depends-on = ["examples-build"] }
roboplan-record = { cmd = "./build-examples/examples/roboplan_ur5 --save build-examples/ur5.rrd", depends-on = ["examples-build"] }

[feature.lint.dependencies]
# clang-tidy needs the builtin headers shipped with the matching clang release.
clang-tools = "21.*"
clang = "21.*"
python = "*"

[feature.lint.tasks]
format = "clang-format -i beet/include/beet/*.hpp beet/tests/*.cpp beet/tests/compile_fail/*.cpp beet/tests/package/*.cpp examples/*.cpp examples/*.hpp beet-rerun/include/beet_rerun/*.hpp"
format-check = "clang-format --dry-run --Werror beet/include/beet/*.hpp beet/tests/*.cpp beet/tests/compile_fail/*.cpp beet/tests/package/*.cpp examples/*.cpp examples/*.hpp beet-rerun/include/beet_rerun/*.hpp"
# compile_fail sources are excluded because they are meant not to compile. The conda include directory is
# implicit for GCC, so it is missing from compile_commands.json.
lint-configure = "cmake --preset dev"
lint = { cmd = "run-clang-tidy -p build -quiet -extra-arg=-isystem$CONDA_PREFIX/include '^(?!.*/compile_fail/).*\\.cpp$'", depends-on = ["lint-configure"] }

[environments]
lint = ["lint"]
